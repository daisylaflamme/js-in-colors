<div class="bar">
  <ng-content select="[jicHeaderStart]" />
  @if (showLogo()) {
    <jic-app-logo class="logo" [link]="homeLink()" />
  }
  <p class="count"><span class="count-word">Lesson </span>{{ lessonNumber() }} of {{ lessonCount() }}</p>
</div>

<h1 class="title">{{ title() }}</h1>
@let parts = leadParts();
<!-- One line on purpose: line breaks here render as spaces ("a path ."). Prettier would re-wrap it. -->
<!-- prettier-ignore -->
<p class="lead">{{ parts.before }}@if (parts.word) {<span class="highlight">{{ parts.word }}</span>}{{ parts.after }}</p>
