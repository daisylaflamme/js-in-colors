name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Kids' privacy rules apply to tooling too: no telemetry from the build tools.
  NX_NO_CLOUD: true
  STORYBOOK_DISABLE_TELEMETRY: 1
  NG_CLI_ANALYTICS: false

jobs:
  checks:
    name: Format, lint, unit tests, build, Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # nx affected needs history

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0 # not needed in this job

      - name: Set Nx base and head for affected
        uses: nrwl/nx-set-shas@v5

      - name: Format
        run: npm run format:check

      - name: Dot artwork (brief check, and the generated file matches docs/dot-art)
        run: |
          node --test tools/dot-art/convert.test.mjs
          npm run dot-art
          git diff --exit-code libs/visuals/src/lib/dot/dot-art.ts

      - name: Lint, unit tests, build (affected on PRs, everything on main)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx nx affected -t lint test build
          else
            npx nx run-many -t lint test build
          fi

      - name: Build Storybook
        run: npx nx build-storybook ui

  e2e:
    name: Cypress smoke + axe (phone, tablet, desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache Cypress binary
        uses: actions/cache@v5
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: Cypress (against the production build)
        run: npx nx e2e web-e2e --configuration=production
        env:
          CI: true

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: cypress-screenshots
          path: dist/cypress/apps/web-e2e/screenshots
          retention-days: 7

  lighthouse:
    # Measured on a clean runner, the same way every time (tools/lighthouse/measure.mjs): a
    # developer machine's load changes Total Blocking Time a lot. Informational: the table goes
    # to the job summary and never blocks a merge.
    name: Lighthouse (mobile, median of 5)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: 0 # not needed in this job

      - name: Build and serve the production build
        run: |
          npx nx build web
          npx nx run web:serve-static --port=4300 > serve.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:4300/ > /dev/null && break; sleep 2; done
          curl -sf http://localhost:4300/ > /dev/null

      - name: Lighthouse
        run: npm run lighthouse
        env:
          LIGHTHOUSE_REPORTS: lighthouse-reports
          LIGHTHOUSE_RUNS: 5

      - name: Upload the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-reports
          path: lighthouse-reports
          retention-days: 7
