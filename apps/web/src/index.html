<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JavaScript in Colors</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Learn what JavaScript ideas mean through color, shapes and tiny games. For kids aged 6 to 12."
    />
    <meta name="theme-color" content="#f5f6ff" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <script>
      // Before the first paint (ADR 0014): put this device's saved settings on the prerendered page,
      // so the text never jumps in size. Reads local storage only and sends nothing. After start-up
      // the settings store owns these attributes. Keys and values are checked by boot-script.spec.ts.
      (function () {
        try {
          var root = document.documentElement;
          var saved = JSON.parse(localStorage.getItem('jic.settings') || '{}') || {};
          if (saved.calmMotion === true) root.setAttribute('data-motion', 'calm');
          if (saved.textSize === 'large' || saved.textSize === 'larger')
            root.setAttribute('data-text-size', saved.textSize);
          if (localStorage.getItem('jic.menuOpen') === 'false') root.setAttribute('data-menu', 'closed');
        } catch (e) {
          // Storage blocked or broken: the page starts with the defaults.
        }
      })();
    </script>
  </head>
  <body>
    <jic-root></jic-root>
  </body>
</html>
